profiles:
  classic:
    upstream: pret/pokeruby
    ref: 63a8cbf0016b351a4e68f7036fa0b77e23d2f2c1
    patch_dir: patches/pokeruby
    purpose: byte/behavior-compatible Ruby baseline and legacy-save verification

  expanded:
    upstream: rh-hideout/pokeemerald-expansion
    ref: 75b806a3ab57a81ff1eb6179288981f0b3cc3050
    patch_dir: patches/pokeemerald-expansion
    purpose: modern engine donor/reference for Generation X-ready Ruby expansion
    status: foundation
    ruby_content_port: pending
    donor_persistent_limits:
      species_bits: 11
      species_max_encoded: 2047
      move_bits: 11
      move_max_encoded: 2047
      held_item_bits: 10
      held_item_max_encoded: 1023
      ability_slot_bits: 2
      note: these packed BoxPokemon limits must be removed or versioned before the Generation X-ready profile is considered complete

policy:
  priority: capacity-before-forms
  form_change: deferred
  generation_target: 10
  reference_language_order:
    - ja
    - ko
    - en
    - other_official

rom_capacity:
  retail_japanese_observed_bytes: 8388608
  localized_observed_bytes: 16777216
  expanded_rom_bytes: 33554432
  expanded_rom_end_address: 0x0A000000
  patch: patches/pokeruby/gen10-rom-capacity.patch

capacity_targets:
  canonical_id_patch: patches/pokeruby/gen10-id-types.patch
  canonical_id_header: include/ruby_gen10_ids.h
  species_id_bits: 16
  move_id_bits: 16
  item_id_bits: 16
  ability_id_bits: 16
  dex_number_bits: 16
  type_id_bits: 8
  generation_id_bits: 8
  form_id_bits_reserved: 16

compatibility:
  preserve_classic_box_pokemon_layout: true
  classic_box_pokemon_size: 0x50
  expanded_packed_box_format_is_not_final: true
  extended_mon_data_strategy: legacy_sector_gap_sidecar_v1
  verified_sidecar_gap_bytes_per_slot: 6200
  sidecar_v1_bytes: 6144
  sidecar_v1_patch: patches/pokeruby/gen10-save-extension.patch
  baseline_manifest: manifests/ruby-rom-save-baseline.json
  do_not_repurpose_legacy_bits_without_migration: true
