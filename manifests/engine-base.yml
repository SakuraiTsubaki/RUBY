profiles:
  classic:
    upstream: pret/pokeruby
    ref: 63a8cbf0016b351a4e68f7036fa0b77e23d2f2c1
    patch_dir: patches/pokeruby
    purpose: byte/behavior-compatible Ruby baseline and legacy-save verification

  expanded:
    upstream: rh-hideout/pokeemerald-expansion
    ref: 75b806a3ab57a81ff1eb6179288981f0b3cc3050
    patch_dir: patches/pokeemerald-expansion
    purpose: modern engine donor/reference for Generation X-ready Ruby expansion
    status: foundation
    ruby_content_port: pending

policy:
  priority: capacity-before-forms
  form_change: deferred
  generation_target: 10
  reference_language_order:
    - ja
    - ko
    - en
    - other_official

capacity_targets:
  species_id_bits: 16
  move_id_bits: 16
  item_id_bits: 16
  ability_id_bits: 16
  dex_number_bits: 16
  type_id_bits: 8
  generation_id_bits: 8
  form_id_bits_reserved: 16

compatibility:
  preserve_classic_box_pokemon_layout: true
  classic_box_pokemon_size: 0x50
  extended_mon_data_strategy: versioned_sidecar_or_v2_record
  do_not_repurpose_legacy_bits_without_migration: true
