name: Build Ruby Generation X save extension

on:
  push:
    paths:
      - "patches/pokeruby/gen10-save-extension.patch"
      - "patches/pokeruby/gen10-mon-metadata-movement.patch"
      - "patches/pokeruby/gen10-save-migration.patch"
      - "patches/pokeruby/gen10-ability-id-api.patch"
      - "patches/pokeruby/gen10-id-types.patch"
      - "tools/analyze_ruby_rom_save.py"
      - "tools/verify_ruby_save_sidecar.py"
      - "docs/ruby-rom-save-expansion.md"
      - "manifests/ruby-rom-save-baseline.json"
      - ".github/workflows/test-gen10-save-extension.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkitarm:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout RUBY project
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            sed -i '/apt\.devkitpro\.org/d' "$source"
          done
          apt-get update
          apt-get install -y libpng-dev pkg-config

      - name: Fetch pinned pokeruby and agbcc
        run: |
          set -euxo pipefail
          git clone https://github.com/pret/pokeruby.git pokeruby
          git -C pokeruby checkout 63a8cbf0016b351a4e68f7036fa0b77e23d2f2c1
          git clone --depth 1 https://github.com/pret/agbcc.git agbcc
          (cd agbcc && ./build.sh && ./install.sh ../pokeruby)

      - name: Apply sidecar patch
        run: |
          set -euxo pipefail
          git -C pokeruby apply --check "$GITHUB_WORKSPACE/patches/pokeruby/gen10-save-extension.patch"
          git -C pokeruby apply "$GITHUB_WORKSPACE/patches/pokeruby/gen10-save-extension.patch"
          git -C pokeruby apply --check "$GITHUB_WORKSPACE/patches/pokeruby/gen10-mon-metadata-movement.patch"
          git -C pokeruby apply "$GITHUB_WORKSPACE/patches/pokeruby/gen10-mon-metadata-movement.patch"
          git -C pokeruby apply --check "$GITHUB_WORKSPACE/patches/pokeruby/gen10-save-migration.patch"
          git -C pokeruby apply "$GITHUB_WORKSPACE/patches/pokeruby/gen10-save-migration.patch"
          git -C pokeruby apply --check "$GITHUB_WORKSPACE/patches/pokeruby/gen10-ability-id-api.patch"
          git -C pokeruby apply "$GITHUB_WORKSPACE/patches/pokeruby/gen10-ability-id-api.patch"
          git -C pokeruby apply --check "$GITHUB_WORKSPACE/patches/pokeruby/gen10-id-types.patch"
          git -C pokeruby apply "$GITHUB_WORKSPACE/patches/pokeruby/gen10-id-types.patch"
          grep -q 'RUBY_SAVE_EXTENSION_SIZE 0x1800' pokeruby/include/ruby_save_extension.h
          grep -q 'RubySaveExtensionWriteSector' pokeruby/src/save.c
          grep -q 'src/ruby_save_extension.o(.text)' pokeruby/ld_script.txt
          grep -q 'src/ruby_save_extension.o(.rodata)' pokeruby/ld_script.txt
          grep -q 'src/ruby_save_extension.o(ewram_data)' pokeruby/sym_ewram.txt
          grep -q 'RubySaveExtensionGetPcMon' pokeruby/src/ruby_save_extension.c
          grep -q 'gRubyStorageHeldMonExtension' pokeruby/src/pokemon_storage_system_4.c
          grep -q 'RubySaveExtensionMigrateLegacyMons' pokeruby/src/ruby_save_extension.c
          grep -q 'RubySaveExtensionMigrateLegacyMons' pokeruby/src/save.c
          grep -q 'typedef u16 RubyAbilityId' pokeruby/include/ruby_save_extension.h
          grep -q 'RubySaveExtensionGetPartyAbility' pokeruby/src/ruby_save_extension.c
          grep -q 'RubySaveExtensionGetPcAbility' pokeruby/src/ruby_save_extension.c
          grep -q 'typedef u16 RubySpeciesId' pokeruby/include/ruby_gen10_ids.h
          grep -q 'typedef u16 RubyMoveId' pokeruby/include/ruby_gen10_ids.h
          grep -q 'typedef u16 RubyItemId' pokeruby/include/ruby_gen10_ids.h
          grep -q 'typedef u16 RubyAbilityId' pokeruby/include/ruby_gen10_ids.h
          grep -q 'typedef u16 RubyDexId' pokeruby/include/ruby_gen10_ids.h
          grep -q 'typedef u16 RubyFormId' pokeruby/include/ruby_gen10_ids.h

      - name: Build patched Ruby
        run: |
          set -euxo pipefail
          make -C pokeruby -f make_tools.mk -j2
          make -C pokeruby generated
          make -C pokeruby -j2
          test -s pokeruby/pokeruby.gba
          grep -q 'gRubySaveExtension' pokeruby/pokeruby.map

      - name: Check repository artifacts
        run: |
          set -euxo pipefail
          python3 "$GITHUB_WORKSPACE/tools/analyze_ruby_rom_save.py" --help >/dev/null
          python3 "$GITHUB_WORKSPACE/tools/verify_ruby_save_sidecar.py" --help >/dev/null
          git -C pokeruby diff --check
