name: Fetch mGBA test binary

on:
  push:
    paths:
      - ".github/workflows/fetch-mgba.yml"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - name: Download official mGBA 0.10.5 AppImage
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -o mGBA-0.10.5-appimage-x64.appimage \
            https://github.com/mgba-emu/mgba/releases/download/0.10.5/mGBA-0.10.5-appimage-x64.appimage
          chmod +x mGBA-0.10.5-appimage-x64.appimage
          sha256sum mGBA-0.10.5-appimage-x64.appimage
      - name: Upload mGBA AppImage
        uses: actions/upload-artifact@v4
        with:
          name: mgba-0.10.5-appimage
          path: mGBA-0.10.5-appimage-x64.appimage
          retention-days: 1
