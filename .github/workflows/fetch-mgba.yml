name: Build headless mGBA tester

on:
  push:
    paths:
      - ".github/workflows/fetch-mgba.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential
      - name: Build mGBA 0.10.5 headless perf tester
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 0.10.5 https://github.com/mgba-emu/mgba.git
          cmake -S mgba -B build -G Ninja \
            -DBUILD_QT=OFF \
            -DBUILD_SDL=OFF \
            -DBUILD_PERF=ON \
            -DBUILD_SHARED=OFF \
            -DBUILD_STATIC=ON \
            -DBUILD_GL=OFF \
            -DBUILD_GLES2=OFF \
            -DBUILD_GLES3=OFF \
            -DDISABLE_DEPS=ON \
            -DUSE_DEBUGGERS=OFF \
            -DUSE_FFMPEG=OFF \
            -DUSE_PNG=OFF \
            -DUSE_ZLIB=OFF \
            -DUSE_MINIZIP=OFF \
            -DUSE_LIBZIP=OFF \
            -DUSE_SQLITE3=OFF \
            -DUSE_ELF=OFF \
            -DUSE_LUA=OFF \
            -DUSE_LZMA=OFF \
            -DUSE_DISCORD_RPC=OFF \
            -DENABLE_SCRIPTING=OFF
          cmake --build build --target mgba-perf
          ./build/mgba-perf --version
          ldd ./build/mgba-perf || true
          cp ./build/mgba-perf ./mgba-perf-0.10.5
          chmod +x ./mgba-perf-0.10.5
          sha256sum ./mgba-perf-0.10.5
      - name: Upload tester
        uses: actions/upload-artifact@v4
        with:
          name: mgba-perf-0.10.5
          path: mgba-perf-0.10.5
          retention-days: 1
