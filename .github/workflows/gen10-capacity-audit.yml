name: Audit Generation X capacity foundation

on:
  push:
    paths:
      - "docs/gen10-expansion-foundation.md"
      - "manifests/engine-base.yml"
      - "tools/audit_gen10_capacity.py"
      - ".github/workflows/gen10-capacity-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout RUBY project
        uses: actions/checkout@v4

      - name: Fetch pinned classic Ruby baseline
        run: |
          set -euxo pipefail
          git clone https://github.com/pret/pokeruby.git classic
          git -C classic checkout 63a8cbf0016b351a4e68f7036fa0b77e23d2f2c1

      - name: Fetch pinned expanded engine reference
        run: |
          set -euxo pipefail
          git clone https://github.com/rh-hideout/pokeemerald-expansion.git expanded
          git -C expanded checkout 75b806a3ab57a81ff1eb6179288981f0b3cc3050

      - name: Generate capacity report
        run: |
          set -euxo pipefail
          python3 tools/audit_gen10_capacity.py             --classic classic             --expanded expanded             --output gen10-capacity-report.json
          grep -q '"generation_target": 10' gen10-capacity-report.json
          grep -q '"BaseStats.ability1": 8' gen10-capacity-report.json
          grep -q '"BattlePokemon.ability": 8' gen10-capacity-report.json
          grep -q '"StringInfoBattle.lastAbility": 8' gen10-capacity-report.json
          grep -q '"AbilityBattleEffects.ability_arg": 8' gen10-capacity-report.json
          grep -q '"ability_8bit_blockers"' gen10-capacity-report.json
          grep -q '"LevelUpMove.move": 9' gen10-capacity-report.json
          grep -q '"0x1FF_mask_refs"' gen10-capacity-report.json
          grep -q '"move_id_blockers"' gen10-capacity-report.json
          grep -q '"index_mask": "0x1FF"' gen10-capacity-report.json
          grep -q '"index_bits": 9' gen10-capacity-report.json
          grep -q '"easy_chat_id_blockers"' gen10-capacity-report.json

      - name: Upload non-ROM capacity report
        uses: actions/upload-artifact@v4
        with:
          name: gen10-capacity-report
          path: gen10-capacity-report.json
          retention-days: 7
